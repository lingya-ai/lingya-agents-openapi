[package]
name = "lingya-agents-sdk"
version = "1.0.0"
edition = "2021"
authors = ["Lingya AI"]
description = "Strongly typed Rust SDK for Lingya Agents OpenAPI"
license = "MIT"
repository = "https://github.com/lingya-ai/lingya-agents-sdk-rust"
readme = "README.md"
keywords = ["lingya", "agents", "openapi", "sdk", "sse"]
categories = ["api-bindings", "web-programming::http-client"]

[dependencies]
async-stream = "0.3"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
getrandom = "0.3"
hex = "0.4"
hmac = "0.12"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_repr = "0.1"
serde_with = { version = "3.8", default-features = false, features = ["base64", "std", "macros"] }
sha2 = "0.10"
thiserror = "2"
url = "2.5"

tokio = { version = "1", features = ["macros", "rt", "time", "sync"] }
tokio-util = "0.7"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
percent-encoding = "2"

[dev-dependencies]
regex = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }

[package.metadata.docs.rs]
all-features = true
