name: Release contract

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run generate:docs
      - name: Verify tag matches contract version
        shell: bash
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./openapi/lingya-agents-v1.json').info.version")"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" openapi/lingya-agents-v1.yaml openapi/lingya-agents-v1.json openapi/endpoints.json docs/index.html --generate-notes
      - name: Notify Kotlin SDK
        env:
          GH_TOKEN: ${{ secrets.SDK_AUTOMATION_TOKEN }}
        shell: bash
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "SDK_AUTOMATION_TOKEN is not configured; skipping SDK update dispatch."
            exit 0
          fi
          gh api repos/lingya-ai/lingya-agents-sdk-kotlin/dispatches \
            -f event_type=contract-released \
            -F client_payload[tag]="$GITHUB_REF_NAME"
