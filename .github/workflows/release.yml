name: Release contract

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify tag matches contract version
        shell: bash
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./openapi/lingya-agents-v1.json').info.version")"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" openapi/lingya-agents-v1.yaml openapi/lingya-agents-v1.json openapi/endpoints.json docs/index.html examples/http-requests.json scripts/sign-request.mjs scripts/hmac.mjs test-vectors/hmac-v1.json test-vectors/sse-v1.txt --generate-notes
      - name: Notify SDK repositories
        env:
          GH_TOKEN: ${{ secrets.SDK_AUTOMATION_TOKEN }}
        shell: bash
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "SDK_AUTOMATION_TOKEN is not configured; skipping SDK update dispatch."
            exit 0
          fi
          for repository in \
            lingya-agents-sdk-kotlin \
            lingya-agents-sdk-typescript \
            lingya-agents-sdk-python \
            lingya-agents-sdk-rust
          do
            gh api "repos/lingya-ai/${repository}/dispatches" \
              -f event_type=contract-released \
              -F client_payload[tag]="$GITHUB_REF_NAME"
          done
