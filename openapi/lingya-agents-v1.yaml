openapi: 3.1.0
info:
  title: Lingya Agents OpenAPI
  version: 0.1.1
  description: Public, tenant-scoped Agent channel API authenticated with OPENAPI-HMAC-SHA256-V1. Studio administration endpoints are not part of this contract.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://{tenantHost}
    variables:
      tenantHost:
        default: tenant.example.com
        description: Tenant host routed by the Lingya gateway.
tags:
  - name: Configuration
    description: Configuration operations exposed to signed OpenAPI clients.
  - name: Chat
    description: Chat operations exposed to signed OpenAPI clients.
  - name: Conversations
    description: Conversations operations exposed to signed OpenAPI clients.
  - name: Messages
    description: Messages operations exposed to signed OpenAPI clients.
  - name: Events
    description: Events operations exposed to signed OpenAPI clients.
  - name: Interactions
    description: Interactions operations exposed to signed OpenAPI clients.
  - name: Files
    description: Files operations exposed to signed OpenAPI clients.
  - name: Knowledge
    description: Knowledge operations exposed to signed OpenAPI clients.
  - name: Workspace
    description: Workspace operations exposed to signed OpenAPI clients.
  - name: SQL
    description: SQL operations exposed to signed OpenAPI clients.
security:
  - OpenApiAccessKey: []
    OpenApiTimestamp: []
    OpenApiNonce: []
    OpenApiUser: []
    OpenApiSignature: []
paths:
  /api/agents/channel/openapi/v1/{channelId}/chat/config:
    get:
      operationId: getAgentsConfig
      tags:
        - Configuration
      summary: getAgentsConfig
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentsConfig"
        "401":
