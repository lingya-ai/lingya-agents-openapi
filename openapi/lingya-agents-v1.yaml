components:
  securitySchemes:
    OpenApiAccessKey:
      type: apiKey
      in: header
      name: X-OpenAPI-AK
      description: 32-character access key.
    OpenApiTimestamp:
      type: apiKey
      in: header
      name: X-OpenAPI-Timestamp
      description: Unix epoch seconds within ±300 seconds of server time.
    OpenApiNonce:
      type: apiKey
      in: header
      name: X-OpenAPI-Nonce
      description: Unpadded Base64URL encoding of 16-64 cryptographically random bytes. A nonce can be used only once.
    OpenApiUser:
      type: apiKey
      in: header
      name: X-OpenAPI-User
      description: Unpadded Base64URL encoding of the 1-256 byte UTF-8 external user identifier.
    OpenApiSignature:
      type: apiKey
      in: header
      name: X-OpenAPI-Signature
      description: Lowercase hexadecimal HMAC-SHA256 signature. The secret is never sent.
  responses:
    Error:
      description: API error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CodeMessage"
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"
  schemas:
    CodeMessage:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: 字段 code / code field。
        message:
          type: string
          description: 消息正文 / message text。
      description: CodeMessage 的公开协议结构。 / Public contract for code message.
      additionalProperties: false
    FieldError:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
          description: 字段 field / field field。
        message:
          type: string
          description: 消息正文 / message text。
      description: FieldError 的公开协议结构。 / Public contract for field error.
      additionalProperties: false
    ValidationError:
      type: object
      required:
        - code
        - message
        - fields
      properties:
        code:
          type: string
          description: 字段 code / code field。
        message:
          type: string
          description: 消息正文 / message text。
        fields:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
          description: 字段 fields / fields field。
      description: ValidationError 的公开协议结构。 / Public contract for validation error.
      additionalProperties: false
    PageInfo:
      type: object
      required:
        - current
        - size
        - total
      properties:
        current:
          type: integer
          format: int32
          minimum: 0
          description: 字段 current / current field。
        size:
          type: integer
          format: int32
          minimum: 0
          description: 大小（字节）或分页容量 / byte size or page size。
        total:
          type: integer
          format: int64
          minimum: 0
          description: 字段 total / total field。
      description: PageInfo 的公开协议结构。 / Public contract for page info.
      additionalProperties: false
    ChatModelSpec:
      type: object
      additionalProperties: false
      required:
        - keyGroupId
        - model
      properties:
        keyGroupId:
          type: integer
          format: int64
          minimum: 1
          description: 字段 keyGroupId / key group id field。
        model:
          type: string
          minLength: 1
          description: 字段 model / model field。
        thinking:
          oneOf:
            - type: boolean
            - type: "null"
          description: 字段 thinking / thinking field。
        stopSequences:
          oneOf:
            - type: array
              items:
                type: string
            - type: "null"
          description: 字段 stopSequences / stop sequences field。
        temperature:
