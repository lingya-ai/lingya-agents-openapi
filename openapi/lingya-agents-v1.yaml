components:
  securitySchemes:
    OpenApiAccessKey:
      type: apiKey
      in: header
      name: X-OpenAPI-AK
      description: 32-character access key.
    OpenApiTimestamp:
      type: apiKey
      in: header
      name: X-OpenAPI-Timestamp
      description: Unix epoch seconds within ±300 seconds of server time.
    OpenApiNonce:
      type: apiKey
      in: header
      name: X-OpenAPI-Nonce
      description: Unpadded Base64URL encoding of 16-64 cryptographically random bytes. A nonce can be used only once.
    OpenApiUser:
      type: apiKey
      in: header
      name: X-OpenAPI-User
      description: Unpadded Base64URL encoding of the 1-256 byte UTF-8 external user identifier.
    OpenApiSignature:
      type: apiKey
      in: header
      name: X-OpenAPI-Signature
      description: Lowercase hexadecimal HMAC-SHA256 signature. The secret is never sent.
  responses:
    Error:
      description: API error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CodeMessage"
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"
  schemas:
    CodeMessage:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    FieldError:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
        message:
          type: string
    ValidationError:
      type: object
      required:
        - code
        - message
        - fields
      properties:
        code:
          type: string
        message:
          type: string
        fields:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    PageInfo:
      type: object
      required:
        - current
        - size
        - total
      properties:
        current:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 0
        total:
          type: integer
          format: int64
          minimum: 0
    ChatModelSpec:
      type: object
      properties:
        provider:
          type: string
        model:
          type: string
        keyGroupId:
          type: integer
          format: int64
      additionalProperties: true
    AttachmentExtension:
      type: object
      required:
        - ext
        - media
      properties:
        ext:
          type: string
        media:
          type: string
    DefaultModel:
      type: object
      required:
        - keyGroupId
        - model
      properties:
        keyGroupId:
          type: integer
          format: int64
        model:
          type: string
    ChatModelConfig:
      type: object
      required:
        - maker
        - modelName
        - modelLabel
        - modelDescription
        - maxContextTokens
        - maxOutputTokens
        - supportImage
        - supportVideo
        - thinkingMode
      properties:
        maker:
          type: string
        modelName:
          type: string
        modelLabel:
          type: string
        modelDescription:
          type: string
        maxContextTokens:
          type: integer
          format: int32
        maxOutputTokens:
          type: integer
          format: int32
        supportImage:
          type: boolean
        supportVideo:
          type: boolean
        thinkingMode:
          type: boolean
    ModelKeyGroup:
      type: object
      required:
        - keyGroupId
        - keyGroupName
        - models
      properties:
        keyGroupId:
          type: integer
          format: int64
        keyGroupName:
          type: string
        models:
          type: array
          items:
            $ref: "#/components/schemas/ChatModelConfig"
    ModelConfig:
      type: object
      required:
        - defaultModel
        - modelKeyGroups
      properties:
        defaultModel:
          oneOf:
            - $ref: "#/components/schemas/DefaultModel"
            - type: "null"
        modelKeyGroups:
          type: array
          items:
            $ref: "#/components/schemas/ModelKeyGroup"
    AiChatFileRef:
      type: object
      required:
        - fileId
      properties:
        fileId:
          type: integer
          format: int64
        fileName:
          type: string
      additionalProperties: true
    AiChatInput:
      type: object
      required:
        - query
      properties:
        query:
          type: string
          minLength: 1
        conversationId:
          type:
            - string
            - "null"
        chatModelSpec:
          oneOf:
            - $ref: "#/components/schemas/ChatModelSpec"
            - type: "null"
        files:
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/AiChatFileRef"
    AiChatStreamInput:
      type: object
      required:
        - messageId
      properties:
        messageId:
          type: string
          minLength: 1
    AiChatSubmission:
      type: object
      required:
        - conversationId
        - messageId
        - disposition
        - status
      properties:
        conversationId:
          type: string
        messageId:
          type: string
        disposition:
          type: string
          description: Dispatch disposition. Unknown future values must be preserved.
        status:
          type: string
          description: Persisted message status. Unknown future values must be preserved.
    AgentsConfig:
      type: object
      required:
        - modelConfig
        - supportAttachmentExt
        - maxAttachmentCount
      properties:
        modelConfig:
          $ref: "#/components/schemas/ModelConfig"
        supportAttachmentExt:
          type: array
          items:
            $ref: "#/components/schemas/AttachmentExtension"
        maxAttachmentCount:
          type: integer
          format: int32
          minimum: 0
    ConversationConfig:
      type: object
      properties:
        lastChatModelSpec:
          oneOf:
            - $ref: "#/components/schemas/ChatModelSpec"
            - type: "null"
    ConversationSummary:
      type: object
      required:
        - conversationId
      properties:
        conversationId:
          type: string
        title:
          type:
            - string
            - "null"
        status:
          type: string
        createdTime:
          type: string
          format: date-time
        lastUpdateTime:
          type: string
          format: date-time
      additionalProperties: true
    ConversationSummaryList:
      type: object
      required:
        - records
      properties:
        records:
          type: array
          items:
            $ref: "#/components/schemas/ConversationSummary"
    ConversationStats:
      type: object
      required:
        - publishId
        - totalConversations
        - activeConversations
        - totalMessages
        - totalTokens
        - avgMessagesPerConversation
      properties:
        publishId:
          type: string
        totalConversations:
          type: integer
          format: int64
        activeConversations:
          type: integer
          format: int64
        totalMessages:
          type: integer
          format: int64
        totalTokens:
          type: integer
          format: int64
        avgMessagesPerConversation:
          type: number
          format: double
    ConversationIds:
      type: object
      required:
        - conversationIds
      properties:
        conversationIds:
          type: array
          items:
            type: string
    ConversationActivityBatchInput:
      type: object
      required:
        - conversationIds
      properties:
        conversationIds:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: string
            minLength: 1
            maxLength: 64
    ConversationActivity:
      type: object
      required:
        - conversationId
        - hasUnreadCompletion
      properties:
        conversationId:
          type: string
        executionStatus:
          type:
            - string
            - "null"
        activeMessageId:
          type:
            - string
            - "null"
        executionEpoch:
          type:
            - integer
            - "null"
          format: int64
        executionStartedTime:
          type:
            - string
            - "null"
          format: date-time
        latestTerminalMessageId:
          type:
            - string
            - "null"
        latestTerminalTime:
          type:
            - string
            - "null"
          format: date-time
        hasUnreadCompletion:
          type: boolean
    ConversationActivityList:
      type: object
      required:
        - records
      properties:
        records:
          type: array
          items:
            $ref: "#/components/schemas/ConversationActivity"
    ConversationReadReceiptInput:
      type: object
      required:
        - messageId
      properties:
        messageId:
          type: string
          minLength: 1
          maxLength: 64
    ConversationReadReceipt:
      allOf:
        - $ref: "#/components/schemas/ConversationActivity"
    ConversationContextUsage:
      type: object
      properties:
        usedTokens:
          type: integer
          format: int64
        maxTokens:
          type: integer
          format: int64
        usageRatio:
          type: number
          format: double
      additionalProperties: true
    ConversationTitle:
      type: object
      required:
        - title
      properties:
        title:
          type: string
        generating:
          type: boolean
          default: false
      additionalProperties: true
    ConversationTitleInput:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
    ConversationStatusInput:
      type: object
      required:
        - status
      properties:
        status:
          type: string
    ConversationUserMessage:
      type: object
      properties:
        query:
          type: string
        files:
          type: array
          items:
            $ref: "#/components/schemas/AiChatFileRef"
      additionalProperties: true
    ConversationMessage:
      type: object
      required:
        - messageId
        - userMessage
        - inputTokens
        - outputTokens
        - totalTokens
        - status
        - createdTime
        - lastUpdateTime
      properties:
        messageId:
          type: string
        userMessage:
          $ref: "#/components/schemas/ConversationUserMessage"
        inputTokens:
          type: integer
          format: int64
        outputTokens:
          type: integer
          format: int64
        totalTokens:
          type: integer
          format: int64
        executionTimeMillis:
          type: integer
          format: int64
        processingSteps:
          type: integer
        totalToolCalls:
          type: integer
        status:
          type: string
        createdTime:
          type: string
          format: date-time
        lastUpdateTime:
          type: string
          format: date-time
        executionType:
          type: string
        parentMessageId:
          type:
            - string
            - "null"
      additionalProperties: true
    ConversationMessagePage:
      type: object
      required:
        - records
        - page
      properties:
        records:
          type: array
          items:
            $ref: "#/components/schemas/ConversationMessage"
        page:
          $ref: "#/components/schemas/PageInfo"
    AsyncTask:
      type: object
      required:
        - asyncTaskId
        - status
      properties:
        asyncTaskId:
          type: string
        status:
          type: string
        createdTime:
          type: string
          format: date-time
      additionalProperties: true
    AsyncTaskPage:
      type: object
      required:
        - records
        - page
      properties:
        records:
          type: array
          items:
            $ref: "#/components/schemas/AsyncTask"
        page:
          $ref: "#/components/schemas/PageInfo"
    AiChatEventsBatchInput:
      type: object
      required:
        - conversationId
        - messageIds
      properties:
        conversationId:
          type: string
          minLength: 1
        messageIds:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: string
            minLength: 1
    ChatStreamProbeInput:
      type: object
      required:
        - probeId
      properties:
        probeId:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,80}$
    ChatStreamProbeEvent:
      type: object
      required:
        - probeId
        - sequence
        - serverElapsedMs
      properties:
        probeId:
          type: string
        sequence:
          type: integer
        serverElapsedMs:
          type: integer
          format: int64
    BaseAiChatBriefEvent:
      type: object
      required:
        - type
      properties:
        type:
          type: string
      additionalProperties: true
    AiChatTextBriefEvent:
      allOf:
        - $ref: "#/components/schemas/BaseAiChatBriefEvent"
        - type: object
          required:
            - message
          properties:
            message:
              type: string
    AiChatErrorBriefEvent:
      allOf:
        - $ref: "#/components/schemas/BaseAiChatBriefEvent"
        - type: object
          required:
            - message
          properties:
            type:
              const: error
            message:
              type: string
    AiChatUserQueryBriefEvent:
      allOf:
        - $ref: "#/components/schemas/BaseAiChatBriefEvent"
        - type: object
          required:
            - query
          properties:
            type:
              const: user-query
            query:
              type: string
            attachments:
              type:
                - array
                - "null"
              items:
                type: object
                additionalProperties: true
    AiChatToolExecutionBriefEvent:
      allOf:
        - $ref: "#/components/schemas/BaseAiChatBriefEvent"
        - type: object
          required:
            - toolCallId
            - toolName
            - status
          properties:
            type:
              const: tool-execution
            toolCallId:
              type: string
            toolName:
              type: string
            status:
              type: string
            action:
              type: string
            summary:
              type:
                - string
                - "null"
            extension:
              type:
                - object
                - "null"
              additionalProperties: true
    AiChatAwaitingInputBriefEvent:
      allOf:
        - $ref: "#/components/schemas/BaseAiChatBriefEvent"
        - type: object
          required:
            - questionId
            - conversationId
            - messageId
            - question
            - options
            - multiple
            - timeoutSeconds
          properties:
            type:
              const: tool-execution-awaiting-user-input
            questionId:
              type: string
            conversationId:
              type: string
            messageId:
              type: string
            question:
              type: string
            questionDetails:
              type: string
            options:
              type: array
              items:
                type: string
            multiple:
              type: boolean
            timeoutSeconds:
              type: integer
            expiresAt:
              type:
                - string
                - "null"
              format: date-time
            serverNow:
              type:
                - string
                - "null"
              format: date-time
    AiChatSubAgentCallBriefEvent:
      allOf:
        - $ref: "#/components/schemas/BaseAiChatBriefEvent"
        - type: object
          required:
            - toolCallId
            - toolName
            - subAgentConversationId
            - subAgentMessageId
          properties:
            type:
              const: tool-execution-sub-agent-call
            toolCallId:
              type: string
            toolName:
              type: string
            subAgentConversationId:
              type: string
            subAgentMessageId:
              type: string
    AiChatCompactorWarningBriefEvent:
      allOf:
        - $ref: "#/components/schemas/BaseAiChatBriefEvent"
        - type: object
          required:
            - level
            - warning
          properties:
            type:
              const: compactor-warning
            level:
              type: string
            warning:
              type: string
    AiChatEndBriefEvent:
      allOf:
        - $ref: "#/components/schemas/BaseAiChatBriefEvent"
        - type: object
          properties:
            type:
              const: end
            totalTokens:
              type: integer
              format: int64
            artifacts:
              type: array
              items:
                type: object
                additionalProperties: true
            nonFileArtifacts:
              type: array
              items:
                type: object
                additionalProperties: true
          additionalProperties: true
    AiChatObjectBriefEvent:
      allOf:
        - $ref: "#/components/schemas/BaseAiChatBriefEvent"
        - type: object
          additionalProperties: true
    AiChatBriefEvent:
      oneOf:
        - $ref: "#/components/schemas/AiChatTextBriefEvent"
        - $ref: "#/components/schemas/AiChatErrorBriefEvent"
        - $ref: "#/components/schemas/AiChatUserQueryBriefEvent"
        - $ref: "#/components/schemas/AiChatToolExecutionBriefEvent"
        - $ref: "#/components/schemas/AiChatAwaitingInputBriefEvent"
        - $ref: "#/components/schemas/AiChatSubAgentCallBriefEvent"
        - $ref: "#/components/schemas/AiChatCompactorWarningBriefEvent"
        - $ref: "#/components/schemas/AiChatEndBriefEvent"
        - $ref: "#/components/schemas/AiChatObjectBriefEvent"
      discriminator:
        propertyName: type
        mapping:
          message: "#/components/schemas/AiChatTextBriefEvent"
          think: "#/components/schemas/AiChatTextBriefEvent"
          error: "#/components/schemas/AiChatErrorBriefEvent"
          user-query: "#/components/schemas/AiChatUserQueryBriefEvent"
          tool-execution: "#/components/schemas/AiChatToolExecutionBriefEvent"
          tool-execution-awaiting-user-input: "#/components/schemas/AiChatAwaitingInputBriefEvent"
          tool-execution-sub-agent-call: "#/components/schemas/AiChatSubAgentCallBriefEvent"
          compactor-warning: "#/components/schemas/AiChatCompactorWarningBriefEvent"
          end: "#/components/schemas/AiChatEndBriefEvent"
          start: "#/components/schemas/AiChatObjectBriefEvent"
          manual-interrupt: "#/components/schemas/AiChatObjectBriefEvent"
          compressor-context-start: "#/components/schemas/AiChatObjectBriefEvent"
          compressor-context-end: "#/components/schemas/AiChatObjectBriefEvent"
          chat-client-request: "#/components/schemas/AiChatObjectBriefEvent"
          chat-client-response: "#/components/schemas/AiChatObjectBriefEvent"
    AiChatBriefEventList:
      type: object
      required:
        - records
      properties:
        records:
          type: array
          items:
            $ref: "#/components/schemas/AiChatBriefEvent"
    AiChatEventsBatch:
      type: object
      properties:
        messages:
          type: array
          items:
            type: object
            additionalProperties: true
        skipped:
          type: array
          items:
            type: object
            additionalProperties: true
      additionalProperties: true
    ConversationShareInput:
      type: object
      properties:
        password:
          type:
            - string
            - "null"
          pattern: ^[0-9]{6}$
        expiresAt:
          type:
            - string
            - "null"
          format: date-time
    ConversationShare:
      type: object
      required:
        - shareId
      properties:
        shareId:
          type: integer
          format: int64
        url:
          type: string
          format: uri
        expiresAt:
          type:
            - string
            - "null"
          format: date-time
      additionalProperties: true
    ConversationShareList:
      type: object
      required:
        - records
      properties:
        records:
          type: array
          items:
            $ref: "#/components/schemas/ConversationShare"
    PlanApprovalInput:
      type: object
      required:
        - conversationId
        - messageId
        - approved
      properties:
        conversationId:
          type: string
        messageId:
          type: string
        approved:
          type: boolean
        feedback:
          type:
            - string
            - "null"
    OperationResult:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
        message:
          type:
            - string
            - "null"
      additionalProperties: true
    PlanStatus:
      type: object
      required:
        - pending
        - status
      properties:
        pending:
          type: boolean
        status:
          type: string
    UserInputStatus:
      type: object
      required:
        - pending
      properties:
        pending:
          type: boolean
        question:
          type:
            - string
            - "null"
        questionDetails:
          type:
            - string
            - "null"
        options:
          type:
            - array
            - "null"
          items:
            type: string
        multiple:
          type:
            - boolean
            - "null"
    UserInputAnswerInput:
      type: object
      required:
        - conversationId
        - messageId
        - questionId
        - selectedOptions
      properties:
        conversationId:
          type: string
        messageId:
          type: string
        questionId:
          type: string
        selectedOptions:
