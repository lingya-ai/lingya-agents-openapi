openapi: 3.1.0
info:
  title: Lingya Agents OpenAPI
  version: 0.1.4
  description: |-
    本契约描述灵涯 Agents 面向可信服务端的公开渠道 API，使用 OPENAPI-HMAC-SHA256-V1 验证请求，不包含 Studio 管理接口。在线文档只展示请求，不会在浏览器中收集或保存 secret。

    This contract describes the public Lingya Agents channel API for trusted servers. Requests use OPENAPI-HMAC-SHA256-V1, and Studio administration endpoints are excluded. The online reference only displays requests and never collects or stores a secret in the browser.

    ## 快速开始 / Quick start

    1. 读取 Configuration，确认模型和附件限制。 / Read Configuration to discover model and attachment limits.

    2. 在本地固定最终 method、raw path、raw query、Content-Type 和 body 字节，再生成签名。 / Finalize method, raw path, raw query, Content-Type, and body bytes locally before signing.

    3. 按业务分组调用接口；SSE 断开后使用 Events 补取。 / Call the appropriate business group and use Events for recovery after an SSE disconnect.

    ## 公共错误 / Common errors

    `401` 签名、时间戳或 nonce 无效；`403` 资源不属于当前渠道用户；`413` 请求体过大；`422` 参数校验失败；`429` 请求过于频繁；`500` 服务内部错误；`503` 依赖或执行服务暂不可用。

    `401` invalid signature, timestamp, or nonce; `403` resource not owned by the current channel user; `413` request body too large; `422` validation failed; `429` rate limited; `500` internal error; `503` dependency or execution service unavailable.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://{tenantHost}
    variables:
      tenantHost:
        default: lingtong.lingya.tech
        description: 灵涯网关路由的租户域名。 / Tenant host routed by the Lingya gateway.
tags:
  - name: Configuration
    description: |-
      用于在服务启动或进入会话前读取 Agent 能力、可选模型、附件限制以及会话当前配置。典型顺序是先读取渠道配置，再按需读取指定会话配置。配置结果应作为客户端校验依据，不要硬编码模型或附件限制。所有资源仍受 channelId 和外部用户隔离。

      Use this group at service startup or before a conversation to discover Agent capabilities, selectable models, attachment limits, and the current conversation configuration. Read channel configuration first, then fetch a conversation configuration when needed. Treat the response as the client-side validation source instead of hard-coding model or attachment limits. All resources remain isolated by channelId and external user.
  - name: Chat
    description: |-
      用于创建或继续会话、订阅实时 SSE、探测流式连接、中断执行及压缩上下文。典型顺序是读取配置，按需上传文件，创建消息，再订阅 SSE；只有在执行中断或上下文接近上限时调用中断或压缩。不要把 SSE 断开等同于服务端执行结束。

      Use this group to create or continue conversations, consume live SSE events, probe streaming connectivity, interrupt execution, and compact context. A typical flow reads configuration, uploads files if needed, submits a message, and then subscribes to SSE. Interrupt or compact only when execution or context state requires it. Do not treat an SSE disconnect as proof that server-side execution ended.
  - name: Conversations
    description: |-
      用于管理会话生命周期和聚合状态，包括列表、活动/未读状态、已读游标、统计、标题、业务状态、分享和删除。列表适合工作台展示，活动查询适合轮询补偿，分享接口只应在明确需要对外共享时使用。删除和撤销分享会改变持久状态。

      Use this group to manage conversation lifecycle and aggregate state, including lists, active or unread state, read cursors, statistics, titles, business status, sharing, and deletion. Lists support workspace views, activity queries support polling recovery, and sharing should be used only for deliberate external access. Deletion and share revocation mutate persistent state.
  - name: Messages
    description: |-
      用于读取会话消息、异步任务和排队状态，以及取消尚未执行的排队消息。消息详情适合审计与结果恢复，异步任务接口用于跟踪长任务。取消接口只对仍在队列中的消息有效，不能代替执行中的中断接口。

      Use this group to read conversation messages, asynchronous tasks, and queue state, and to cancel messages that have not started. Message detail supports auditing and result recovery, while task endpoints track long-running work. Queue cancellation applies only to queued messages and does not replace interruption of active execution.
  - name: Events
    description: |-
      用于在 SSE 中断、客户端重启或需要审计时补取已持久化事件。单消息查询适合精确恢复，批量查询适合一次恢复多条消息。事件补取不会重新触发 Agent 执行，也不能替代实时 SSE。

      Use this group to recover persisted events after an SSE interruption, client restart, or during auditing. The single-message endpoint performs precise recovery, while the batch endpoint restores multiple messages. Event retrieval does not re-run Agent execution and does not replace live SSE.
  - name: Interactions
    description: |-
      用于处理 Agent 执行期间产生的计划审批和用户问答。客户端通常从 SSE 工具事件取得 planId 或 questionId，查询状态后提交审批或回答。必须同时保持原 conversationId、messageId 和问题标识，重复提交应按返回状态处理。

      Use this group for plan approvals and user questions produced during Agent execution. Clients normally obtain planId or questionId from SSE tool events, inspect status, and then submit an approval or answer. Preserve the original conversationId, messageId, and interaction identifier, and handle duplicate submissions according to the returned state.
  - name: Files
    description: |-
      用于附件去重、预签名上传、上传确认和预览。推荐先按 MD5 检查或复用文件；需要上传时依次申请预签名地址、直接上传对象存储、再确认上传。预签名地址有时效，确认前不得把文件 ID 用于聊天。

      Use this group for attachment deduplication, presigned uploads, upload confirmation, and previews. Prefer checking or reusing a file by MD5. For a new upload, request a presigned URL, upload directly to object storage, and then confirm the upload. Presigned URLs expire, and a file ID must not be used in chat before confirmation.
  - name: Knowledge
    description: |-
      用于把消息或工具事件中的知识引用解析为可展示的来源元数据。单条接口适合按需展开，批量接口适合一次渲染整条回答的引用列表。调用方应使用服务端返回的引用类型和 ID，不要自行猜测知识库内部地址。

      Use this group to resolve knowledge references from messages or tool events into displayable source metadata. Use the single endpoint for on-demand expansion and the batch endpoint to render all citations for an answer. Use the citation type and ID returned by the server rather than guessing internal knowledge-base locations.
  - name: Workspace
    description: |-
      用于浏览 Agent 在会话工作区生成的文件和非文件制品，并为具体路径创建预览地址。先分页列出制品，再对文件路径请求预览。路径必须来自工作区列表并保持原始相对路径，不能作为任意文件系统路径使用。

      Use this group to browse files and non-file artifacts produced in a conversation workspace and to create preview URLs for specific paths. List artifacts first, then request a preview for a returned file path. Preserve the workspace-relative path exactly and never treat it as an arbitrary filesystem path.
  - name: SQL
    description: |-
      用于读取 SQL 工具产生的结果集、图表数据和导出文件。resultId 来自聊天事件或消息工具扩展；先分页读取以检查数据，再按需读取图表或导出 CSV/XLSX。导出是二进制流，不能按 JSON 解析。

      Use this group to read result sets, chart data, and export files produced by the SQL tool. Obtain resultId from chat events or message tool extensions, inspect paged data first, and then fetch chart data or export CSV/XLSX as needed. Exports are binary streams and must not be parsed as JSON.
security:
  - OpenApiAccessKey: []
    OpenApiTimestamp: []
    OpenApiNonce: []
    OpenApiUser: []
    OpenApiSignature: []
paths:
  /api/agents/channel/openapi/v1/{channelId}/chat/config:
    get:
      operationId: getAgentsConfig
      tags:
        - Configuration
      summary: 读取 Agent 配置 / Get Agent configuration
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
          x-lingya-sdk-bound-from: channelId
          description: Agent OpenAPI 渠道 UUID。 / Agent OpenAPI channel UUID.
          example: 11111111-2222-4333-8444-555555555555
      responses:
        "200":
          description: 读取 Agent 配置 / Get Agent configuration 的成功响应。 / Successful response for getAgentsConfig.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentsConfig"
              example:
                modelConfig:
                  defaultModel:
                    keyGroupId: 42
                    model: example-model
                  modelKeyGroups:
                    - keyGroupId: 42
                      keyGroupName: Example models
                      models:
                        - maker: OPENAI
                          modelName: example-model
                          modelLabel: Example model
                          modelDescription: Example model used for integration
                          maxContextTokens: 1
                          maxOutputTokens: 1
                          supportImage: true
                          supportVideo: true
                          thinkingMode: true
                supportAttachmentExt:
                  - ext: example
                    media: example
                maxAttachmentCount: 10
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
      description: |-
        ### 使用场景
        在初始化客户端能力或展示模型选择器前读取渠道配置。

        ### Use case
        Read channel configuration before initializing client capabilities or showing model choices.

        ### 前置条件
        仅需有效渠道凭证。

        ### Prerequisites
        Only valid channel credentials are required.

        ### 行为与副作用
        只读，不修改配置。

        ### Behavior and side effects
        Read-only; no configuration is changed.

        ### 后续调用
        按附件限制准备文件，或创建会话。

        ### Next step
        Prepare files according to the limits or create a conversation.

        ### 接口摘要
        读取 Agent 配置 / Get Agent configuration

        ### Operation summary
        读取 Agent 配置 / Get Agent configuration
      x-codeSamples:
        - lang: HTTP
          label: Raw HTTP
          source: |-
            GET /api/agents/channel/openapi/v1/11111111-2222-4333-8444-555555555555/chat/config HTTP/1.1
            Host: lingtong.lingya.tech
            X-OpenAPI-AK: <access-key>
            X-OpenAPI-Timestamp: <unix-seconds>
            X-OpenAPI-Nonce: <base64url-nonce>
            X-OpenAPI-User: <base64url-external-user>
            X-OpenAPI-Signature: <lowercase-hex-signature>
        - lang: Shell
          label: cURL + local HMAC
          source: |-
            BASE_URL="${BASE_URL:-https://lingtong.lingya.tech}"
            CHANNEL_ID="${CHANNEL_ID:-11111111-2222-4333-8444-555555555555}"
            EXTERNAL_USER_ID="${EXTERNAL_USER_ID:-external-user-demo}"
            RAW_PATH="/api/agents/channel/openapi/v1/$CHANNEL_ID/chat/config"
            RAW_QUERY=""
            eval "$(node scripts/sign-request.mjs --method GET --path "$RAW_PATH" --query "$RAW_QUERY" --user "$EXTERNAL_USER_ID" --format shell)"

            curl --request GET "${BASE_URL}${RAW_PATH}${RAW_QUERY:+?${RAW_QUERY}}" \
              -H "X-OpenAPI-AK: ${X_OPENAPI_AK}" \
              -H "X-OpenAPI-Timestamp: ${X_OPENAPI_TIMESTAMP}" \
              -H "X-OpenAPI-Nonce: ${X_OPENAPI_NONCE}" \
              -H "X-OpenAPI-User: ${X_OPENAPI_USER}" \
              -H "X-OpenAPI-Signature: ${X_OPENAPI_SIGNATURE}"
  /api/agents/channel/openapi/v1/{channelId}/chat/conversations/{conversationId}/config:
    get:
      operationId: getConversationConfig
      tags:
        - Configuration
      summary: 读取会话配置 / Get conversation configuration
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
          x-lingya-sdk-bound-from: channelId
          description: Agent OpenAPI 渠道 UUID。 / Agent OpenAPI channel UUID.
          example: 11111111-2222-4333-8444-555555555555
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
          description: 会话 ID；必须属于当前外部用户。 / Conversation ID owned by the current external user.
          example: conversation-demo-001
      responses:
        "200":
          description: 读取会话配置 / Get conversation configuration 的成功响应。 / Successful response for getConversationConfig.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationConfig"
              example:
                lastChatModelSpec:
                  keyGroupId: 42
                  model: example-model
                  thinking: true
                  stopSequences:
                    - example
                  temperature: 0
                  maxTokens: 1
                  topP: 0
                  topK: 1
                  frequencyPenalty: -2
                  presencePenalty: -2
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
      description: |-
        ### 使用场景
        恢复会话时读取该会话最近使用的模型配置。

        ### Use case
        Read the most recently used model configuration when resuming a conversation.

        ### 前置条件
        渠道凭证和外部用户已配置，目标资源属于当前用户。

        ### Prerequisites
        Channel credentials and the external user are configured, and the target resource belongs to that user.

        ### 行为与副作用
        只读，不修改会话。

        ### Behavior and side effects
        Read-only; the conversation is unchanged.

        ### 后续调用
        继续提交消息或展示当前模型。

        ### Next step
        Submit another message or display the current model.

        ### 接口摘要
        读取会话配置 / Get conversation configuration

        ### Operation summary
        读取会话配置 / Get conversation configuration
      x-codeSamples:
        - lang: HTTP
          label: Raw HTTP
          source: |-
            GET /api/agents/channel/openapi/v1/11111111-2222-4333-8444-555555555555/chat/conversations/conversation-demo-001/config HTTP/1.1
            Host: lingtong.lingya.tech
            X-OpenAPI-AK: <access-key>
            X-OpenAPI-Timestamp: <unix-seconds>
            X-OpenAPI-Nonce: <base64url-nonce>
            X-OpenAPI-User: <base64url-external-user>
            X-OpenAPI-Signature: <lowercase-hex-signature>
        - lang: Shell
          label: cURL + local HMAC
          source: |-
            BASE_URL="${BASE_URL:-https://lingtong.lingya.tech}"
            CHANNEL_ID="${CHANNEL_ID:-11111111-2222-4333-8444-555555555555}"
            EXTERNAL_USER_ID="${EXTERNAL_USER_ID:-external-user-demo}"
            RAW_PATH="/api/agents/channel/openapi/v1/$CHANNEL_ID/chat/conversations/conversation-demo-001/config"
            RAW_QUERY=""
            eval "$(node scripts/sign-request.mjs --method GET --path "$RAW_PATH" --query "$RAW_QUERY" --user "$EXTERNAL_USER_ID" --format shell)"

            curl --request GET "${BASE_URL}${RAW_PATH}${RAW_QUERY:+?${RAW_QUERY}}" \
              -H "X-OpenAPI-AK: ${X_OPENAPI_AK}" \
              -H "X-OpenAPI-Timestamp: ${X_OPENAPI_TIMESTAMP}" \
              -H "X-OpenAPI-Nonce: ${X_OPENAPI_NONCE}" \
              -H "X-OpenAPI-User: ${X_OPENAPI_USER}" \
              -H "X-OpenAPI-Signature: ${X_OPENAPI_SIGNATURE}"
  /api/agents/channel/openapi/v1/{channelId}/chat:
    post:
      operationId: createChat
      tags:
        - Chat
      summary: 创建会话并提交消息 / Create a conversation and submit a message
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
          x-lingya-sdk-bound-from: channelId
          description: Agent OpenAPI 渠道 UUID。 / Agent OpenAPI channel UUID.
          example: 11111111-2222-4333-8444-555555555555
      responses:
        "201":
          description: 创建会话并提交消息 / Create a conversation and submit a message 的成功响应。 / Successful response for createChat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiChatSubmission"
              example:
                conversationId: conversation-demo-001
                messageId: message-demo-001
                disposition: queued
                status: COMPLETED
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiChatInput"
            example:
              query: Summarize the quarterly report
              conversationId: conversation-demo-001
              chatModelSpec:
                keyGroupId: 42
                model: example-model
                thinking: true
                stopSequences:
                  - example
                temperature: 0
                maxTokens: 1
                topP: 0
                topK: 1
                frequencyPenalty: -2
                presencePenalty: -2
              files:
                - id: 1
                  fileName: quarterly-report.pdf
        description: 创建会话并提交消息 / Create a conversation and submit a message 的 JSON 请求参数。 / JSON request parameters for createChat.
      description: |-
        ### 使用场景
        创建新会话并提交第一条用户消息。

        ### Use case
        Create a conversation and submit its first user message.

        ### 前置条件
        已读取配置；引用的文件已经确认上传。

        ### Prerequisites
        Configuration has been read and referenced files are confirmed uploads.

        ### 行为与副作用
        创建会话和消息，并安排 Agent 执行。

        ### Behavior and side effects
        Creates a conversation and message and schedules Agent execution.

        ### 后续调用
        使用返回的 conversationId 和 messageId 订阅 SSE。

        ### Next step
        Use the returned conversationId and messageId to subscribe to SSE.

        ### 接口摘要
        创建会话并提交消息 / Create a conversation and submit a message

        ### Operation summary
        创建会话并提交消息 / Create a conversation and submit a message
      x-codeSamples:
        - lang: HTTP
          label: Raw HTTP
          source: |-
            POST /api/agents/channel/openapi/v1/11111111-2222-4333-8444-555555555555/chat HTTP/1.1
            Host: lingtong.lingya.tech
            X-OpenAPI-AK: <access-key>
            X-OpenAPI-Timestamp: <unix-seconds>
            X-OpenAPI-Nonce: <base64url-nonce>
            X-OpenAPI-User: <base64url-external-user>
            X-OpenAPI-Signature: <lowercase-hex-signature>
            Content-Type: application/json

            {
              "query": "Summarize the quarterly report",
              "conversationId": "conversation-demo-001",
              "chatModelSpec": {
                "keyGroupId": 42,
                "model": "example-model",
                "thinking": true,
                "stopSequences": [
                  "example"
                ],
                "temperature": 0,
                "maxTokens": 1,
                "topP": 0,
                "topK": 1,
                "frequencyPenalty": -2,
                "presencePenalty": -2
              },
              "files": [
                {
                  "id": 1,
                  "fileName": "quarterly-report.pdf"
                }
              ]
            }
        - lang: Shell
          label: cURL + local HMAC
          source: |-
            BASE_URL="${BASE_URL:-https://lingtong.lingya.tech}"
            CHANNEL_ID="${CHANNEL_ID:-11111111-2222-4333-8444-555555555555}"
            EXTERNAL_USER_ID="${EXTERNAL_USER_ID:-external-user-demo}"
            RAW_PATH="/api/agents/channel/openapi/v1/$CHANNEL_ID/chat"
            RAW_QUERY=""
            BODY=$(cat <<'JSON'
            {
              "query": "Summarize the quarterly report",
              "conversationId": "conversation-demo-001",
              "chatModelSpec": {
                "keyGroupId": 42,
                "model": "example-model",
                "thinking": true,
                "stopSequences": [
                  "example"
                ],
                "temperature": 0,
                "maxTokens": 1,
                "topP": 0,
                "topK": 1,
                "frequencyPenalty": -2,
                "presencePenalty": -2
              },
              "files": [
                {
                  "id": 1,
                  "fileName": "quarterly-report.pdf"
                }
              ]
            }
            JSON
            )
            eval "$(node scripts/sign-request.mjs --method POST --path "$RAW_PATH" --query "$RAW_QUERY" --user "$EXTERNAL_USER_ID" --content-type application/json --body "$BODY" --format shell)"

            curl --request POST "${BASE_URL}${RAW_PATH}${RAW_QUERY:+?${RAW_QUERY}}" \
              -H "X-OpenAPI-AK: ${X_OPENAPI_AK}" \
              -H "X-OpenAPI-Timestamp: ${X_OPENAPI_TIMESTAMP}" \
              -H "X-OpenAPI-Nonce: ${X_OPENAPI_NONCE}" \
              -H "X-OpenAPI-User: ${X_OPENAPI_USER}" \
              -H "X-OpenAPI-Signature: ${X_OPENAPI_SIGNATURE}" \
              -H "Content-Type: application/json" \
              --data-binary "$BODY"
  /api/agents/channel/openapi/v1/{channelId}/chat/conversations/{conversationId}:
    post:
      operationId: continueChat
      tags:
        - Chat
      summary: 向已有会话提交消息 / Submit a message to an existing conversation
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
          x-lingya-sdk-bound-from: channelId
          description: Agent OpenAPI 渠道 UUID。 / Agent OpenAPI channel UUID.
          example: 11111111-2222-4333-8444-555555555555
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
          description: 会话 ID；必须属于当前外部用户。 / Conversation ID owned by the current external user.
          example: conversation-demo-001
      responses:
        "201":
          description: 向已有会话提交消息 / Submit a message to an existing conversation 的成功响应。 / Successful response for continueChat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiChatSubmission"
              example:
                conversationId: conversation-demo-001
                messageId: message-demo-001
                disposition: queued
                status: COMPLETED
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiChatInput"
            example:
              query: Summarize the quarterly report
              conversationId: conversation-demo-001
              chatModelSpec:
                keyGroupId: 42
                model: example-model
                thinking: true
                stopSequences:
                  - example
                temperature: 0
                maxTokens: 1
                topP: 0
                topK: 1
                frequencyPenalty: -2
                presencePenalty: -2
              files:
