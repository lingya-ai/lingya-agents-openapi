        - name: channelId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - &a1
          name: current
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
        - &a2
          name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            maximum: 1000
            default: 30
        - &a3
          name: orderBy
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
        - &a4
          name: orderDirection
          in: query
          required: false
          schema:
            type: string
            enum:
              - ASC
              - DESC
            default: ASC
        - &a5
          name: orderNullHandling
          in: query
          required: false
          schema:
            type: string
            enum:
              - NATIVE
              - NULLS_FIRST
              - NULLS_LAST
            default: NATIVE
        - &a6
          name: keyword
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
