x-lingya-hmac:
  algorithm: HMAC-SHA256
  version: OPENAPI-HMAC-SHA256-V1
  canonicalFields:
    - version
    - accessKey
    - timestamp
    - nonce
    - method
    - rawPath
    - rawQuery
    - encodedUser
    - contentType
    - sha256(body)
  separator: \n
  signatureEncoding: lowercase-hex
  notes:
    - Build the final request URI and body bytes before signing.
    - Do not re-encode the path, query, JSON, or Content-Type after signing.
    - Content-Encoding is not supported. Request bodies are limited to 2 MiB.
